<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DOGS Rocket 🚀</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
margin:0;
background:#070b16;
color:white;
font-family:tahoma;
text-align:center;
}

.box{
margin:15px;
padding:20px;
background:#121a2b;
border-radius:20px;
}

h1{
font-size:28px;
}

.balance{
font-size:24px;
color:#4cff7a;
}

.rocket{
font-size:80px;
height:180px;
transition:.2s;
}

.mult{
font-size:50px;
font-weight:bold;
}

input,button{
width:90%;
padding:15px;
margin:8px;
border-radius:15px;
border:0;
font-size:18px;
}

button{
background:#2196f3;
color:white;
font-weight:bold;
}

button:disabled{
opacity:.5;
}

.win{
color:#4cff7a;
}

.lose{
color:red;
}

</style>

</head>

<body>

<div class="box">

<h1>🐶 DOGS Rocket 🚀</h1>

<div class="balance" id="balance">
DOGS: 0
</div>

</div>


<div class="box">

<div class="rocket" id="rocket">
🚀
</div>

<div class="mult" id="mult">
1.00x
</div>

<div id="msg">
ضریب خود را انتخاب کن
</div>

</div>


<div class="box">

<input 
id="bet"
type="number"
value="100"
placeholder="مبلغ DOGS">


<input
id="target"
type="number"
step="0.1"
value="2"
placeholder="ضریب هدف مثال 2.00">


<button id="start">
🚀 شروع پرواز
</button>


</div>


<script>

const tg =
window.Telegram.WebApp;

tg.ready();


let money=0;
let running=false;
let timer;


async function load(){

let r=await fetch(
"/api/balance",
{
method:"POST",
headers:{
"X-Telegram-Init-Data":tg.initData
}
});

let d=await r.json();

money=d.dogs;

document.getElementById(
"balance"
).innerHTML =
"🐶 DOGS: "+money;

}


document.getElementById(
"start"
).onclick=async()=>{


if(running)return;


let bet=
Number(
document.getElementById("bet").value
);


let target=
Number(
document.getElementById("target").value
);



if(target<1.1){

alert("ضریب اشتباه است");

return;

}



let start=

await fetch(
"/api/start-game",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"X-Telegram-Init-Data":tg.initData
},

body:JSON.stringify({
bet:bet
})

});


let data=
await start.json();



if(data.error){

alert(data.error);

return;

}



money=data.dogs;


document.getElementById(
"balance"
).innerHTML=
"🐶 DOGS: "+money;



running=true;



let m=1;


document.getElementById(
"msg"
).innerHTML=
"🚀 موشک پرواز کرد";


timer=setInterval(()=>{


m+=0.01;


document.getElementById(
"mult"
).innerHTML=
m.toFixed(2)+"x";



document.getElementById(
"rocket"
).style.transform=
"translateY(-"+m*10+"px)";



if(m>=target){

clearInterval(timer);


document.getElementById(
"msg"
).innerHTML=
"🎉 بردی!";


document.getElementById(
"msg"
).className="win";



fetch(
"/api/cashout",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"X-Telegram-Init-Data":tg.initData
},

body:JSON.stringify({

game_id:data.game_id,

multiplier:target

})

})
.then(r=>r.json())
.then(x=>{

money=x.dogs;

document.getElementById(
"balance"
).innerHTML=
"🐶 DOGS: "+money;

});


running=false;


}



if(m>=data.crash){


clearInterval(timer);


document.getElementById(
"rocket"
).innerHTML="💥";


document.getElementById(
"msg"
).innerHTML=
"💥 موشک ترکید!";


document.getElementById(
"msg"
).className="lose";


running=false;


}



},50);



};



load();


</script>

</body>
</html>
