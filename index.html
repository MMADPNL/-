<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>LIMBO DOGS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}


body{

    margin:0;
    min-height:100vh;
    background:#070a10;
    color:#fff;
    font-family:Arial,sans-serif;

}


.app{

    max-width:520px;
    margin:auto;
    padding:16px;

}



.header{

    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;

}



.logo{

    font-size:24px;
    font-weight:900;

}



.balance{

    background:#151b27;
    border:1px solid #293244;
    border-radius:13px;
    padding:9px 12px;
    font-size:13px;

}



.balance b{

    direction:ltr;
    display:inline-block;

}



.game{

    height:310px;
    border-radius:24px;

    background:
    radial-gradient(circle at center,
    #202a3b 0,
    #101621 38%,
    #080b12 75%);

    border:1px solid #293244;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    margin-bottom:15px;

}



.icon{

    font-size:65px;
    margin-bottom:8px;

}



.multiplier{

    direction:ltr;
    font-size:58px;
    font-weight:900;

}



.status{

    margin-top:8px;
    color:#9aa4b5;
    font-size:13px;

}



.panel{

    background:#111620;
    border:1px solid #293244;
    border-radius:20px;
    padding:15px;

}



.field{

    margin-bottom:15px;

}



label{

    display:block;
    color:#9ca7b8;
    font-size:13px;
    margin-bottom:7px;

}



input{

    width:100%;
    height:52px;

    background:#080c13;

    border:1px solid #303a4d;

    border-radius:13px;

    color:#fff;

    padding:0 14px;

    font-size:17px;

    direction:ltr;

    outline:none;

}



.quick{

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:7px;

}



.quick button{

    height:38px;
    border:0;
    border-radius:10px;
    background:#1b2331;
    color:#fff;

}



.play{

    width:100%;
    height:56px;

    border:0;
    border-radius:15px;

    background:#fff;

    color:#070a10;

    font-size:18px;

    font-weight:900;

}



.play:disabled{

    opacity:.5;

}



.info{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;

}



.infoBox{

    background:#090d14;

    border-radius:13px;

    padding:12px;

    text-align:center;

}



.infoTitle{

    color:#8993a5;
    font-size:11px;
    margin-bottom:6px;

}



.infoValue{

    direction:ltr;
    font-weight:bold;

}



.message{

    min-height:22px;

    text-align:center;

    margin-top:12px;

    color:#aeb7c6;

    font-size:13px;

}



.history{

    margin-top:15px;

}


.historyTitle{

    font-weight:bold;
    margin-bottom:9px;

}



.historyItem{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:#111620;

    border:1px solid #242d3d;

    border-radius:12px;

    padding:10px;

    margin-bottom:7px;

    font-size:12px;

}


.win{

color:#62e6a2;

}


.lose{

color:#ff6d78;

}

</style>

    </head>
