<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIMBO DOGS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

body{
margin:0;
min-height:100vh;
background:#070a10;
color:#fff;
font-family:Arial,sans-serif
}

.app{
max-width:520px;
margin:auto;
padding:16px
}

.header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px
}

.logo{
font-size:24px;
font-weight:900
}

.balance{
background:#151b27;
border:1px solid #293244;
border-radius:13px;
padding:9px 12px;
font-size:13px
}

.balance b{
direction:ltr;
display:inline-block
}

.game{
height:310px;
border-radius:24px;
background:
radial-gradient(circle at center,#202a3b 0,#101621 38%,#080b12 75%);
border:1px solid #293244;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
margin-bottom:15px
}

.icon{
font-size:65px;
margin-bottom:8px
}

.multiplier{
direction:ltr;
font-size:58px;
font-weight:900
}

.status{
margin-top:8px;
color:#9aa4b5;
font-size:13px
}

.panel{
background:#111620;
border:1px solid #293244;
border-radius:20px;
padding:15px
}

.field{
margin-bottom:15px
}

label{
display:block;
color:#9ca7b8;
font-size:13px;
margin-bottom:7px
}

input{
width:100%;
height:52px;
background:#080c13;
border:1px solid #303a4d;
border-radius:13px;
color:#fff;
padding:0 14px;
font-size:17px;
direction:ltr;
outline:none
}

input:focus{
border-color:#68758a
}

.quick{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-top:7px
}

.quick button{
height:38px;
border:0;
border-radius:10px;
background:#1b2331;
color:#fff
}

.play{
width:100%;
height:56px;
border:0;
border-radius:15px;
background:#fff;
color:#070a10;
font-size:18px;
font-weight:900
}

.play:disabled{
opacity:.5
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:12px
}

.infoBox{
background:#090d14;
border-radius:13px;
padding:12px;
text-align:center
}

.infoTitle{
color:#8993a5;
font-size:11px;
margin-bottom:6px
}

.infoValue{
direction:ltr;
font-weight:bold
}

.message{
min-height:22px;
text-align:center;
margin-top:12px;
color:#aeb7c6;
font-size:13px
}

.history{
margin-top:15px
}

.historyTitle{
font-weight:bold;
margin-bottom:9px
}

.historyItem{
display:flex;
justify-content:space-between;
align-items:center;
background:#111620;
border:1px solid #242d3d;
border-radius:12px;
padding:10px;
margin-bottom:7px;
font-size:12px
}

.win{
color:#62e6a2
}

.lose{
color:#ff6d78
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<div class="logo">
🐶 LIMBO
</div>

<div class="balance">
موجودی:
<b id="balance">در حال دریافت...</b>
</div>

</div>


<div class="game">

<div class="icon">🎯</div>

<div
class="multiplier"
id="multiplier">
1.00x
</div>

<div
class="status"
id="status">
ضریب هدف را انتخاب کنید
</div>

</div>


<div class="panel">

<div class="field">

<label>تعداد DOGS</label>

<input
id="bet"
type="number"
min="1"
step="1"
placeholder="مثلاً 500">

<div class="quick">

<button onclick="setBet(100)">100</button>
<button onclick="setBet(500)">500</button>
<button onclick="setBet(1000)">1K</button>
<button onclick="setBet(5000)">5K</button>

</div>

</div>


<div class="field">

<label>ضریب هدف</label>

<input
id="target"
type="number"
min="1.01"
step="0.01"
value="2.00">

<div class="quick">

<button onclick="setTarget(1.5)">1.50x</button>
<button onclick="setTarget(2)">2.00x</button>
<button onclick="setTarget(3)">3.00x</button>
<button onclick="setTarget(5)">5.00x</button>

</div>

</div>


<button
class="play"
id="playButton"
onclick="play()">

🎮 شروع LIMBO

</button>


<div class="info">

<div class="infoBox">

<div class="infoTitle">
ضریب هدف
</div>

<div
class="infoValue"
id="targetView">
2.00x
</div>

</div>


<div class="infoBox">

<div class="infoTitle">
برد احتمالی
</div>

<div
class="infoValue"
id="winView">
0 DOGS
</div>

</div>

</div>


<div
class="message"
id="message">
</div>

</div>


<div class="history">

<div class="historyTitle">
📜 تاریخچه
</div>

<div id="history"></div>

</div>

</div>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =====================================================
   API
===================================================== */

/*
   بعداً این مقدار را با آدرس واقعی API عوض کن.

   مثال:
   https://your-api-domain.com
*/

const API_URL = "https://YOUR-API-DOMAIN.com";


/* =====================================================
   USER
===================================================== */

let telegramUser = null;

if(
tg &&
tg.initDataUnsafe &&
tg.initDataUnsafe.user
){

telegramUser =
tg.initDataUnsafe.user;

}


/*
   برای تست مرورگر عادی
*/

const userId =
telegramUser
? telegramUser.id
: 0;


/* =====================================================
   BALANCE
===================================================== */

let balance = 0;

let loadingBalance = true;


function showBalance(){

const el =
document.getElementById("balance");

if(loadingBalance){

el.innerText =
"در حال دریافت...";

return;

}

el.innerText =
Number(balance).toLocaleString()
+
" DOGS";

}


async function loadBalance(){

if(!userId){

balance = 0;

loadingBalance = false;

showBalance();

message(
"⚠️ مینی‌اپ را از داخل تلگرام باز کنید."
);

return;

}


try{

const response =
await fetch(
API_URL +
"/api/balance?user_id=" +
encodeURIComponent(userId),
{
method:"GET",
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"API ERROR " +
response.status
);

}


const data =
await response.json();


if(!data.ok){

throw new Error(
data.error ||
"API ERROR"
);

}


balance =
Number(data.balance) || 0;

loadingBalance = false;

showBalance();

updateWin();


}catch(error){

console.error(error);

loadingBalance = false;

balance = 0;

showBalance();

message(
"⚠️ اتصال به سرور موجودی برقرار نشد."
);

}

}


showBalance();

loadBalance();


/* =====================================================
   INPUT
===================================================== */

function setBet(value){

document.getElementById("bet").value =
value;

updateWin();

}


function setTarget(value){

document.getElementById("target").value =
value;

updateWin();

}


function updateWin(){

const bet =
Number(
document.getElementById("bet").value
) || 0;


const target =
Number(
document.getElementById("target").value
) || 0;


const win =
bet * target;


document.getElementById(
"targetView"
).innerText =
target.toFixed(2) +
"x";


document.getElementById(
"winView"
).innerText =
win.toLocaleString() +
" DOGS";

}


document
.getElementById("bet")
.addEventListener(
"input",
updateWin
);


document
.getElementById("target")
.addEventListener(
"input",
updateWin
);


/* =====================================================
   MESSAGE
===================================================== */

function message(text){

document.getElementById(
"message"
).innerText =
text;

}


/* =====================================================
   GAME
===================================================== */

let playing = false;


function play(){

if(playing)
return;


if(loadingBalance){

message(
"⏳ موجودی در حال دریافت است."
);

return;

}


const bet =
Number(
document.getElementById("bet").value
);


const target =
Number(
document.getElementById("target").value
);


if(
!Number.isFinite(bet) ||
bet <= 0
){

message(
"❌ مقدار DOGS را وارد کنید."
);

return;

}


if(
!Number.isFinite(target) ||
target < 1.01
){

message(
"❌ ضریب باید حداقل 1.01 باشد."
);

return;

}


if(bet > balance){

message(
"❌ موجودی کافی نیست."
);

return;

}


playing = true;


const button =
document.getElementById(
"playButton"
);


button.disabled = true;

button.innerText =
"⏳ در حال اجرا...";


message(
"بازی شروع شد..."
);


balance -= bet;

showBalance();


const crash =
generateCrash();


let current = 1.00;


const timer =
setInterval(function(){

current +=
Math.random() *
0.12 +
0.03;


if(current >= crash){

current = crash;

clearInterval(timer);

finishGame(
bet,
target,
crash
);

return;

}


document.getElementById(
"multiplier"
).innerText =
current.toFixed(2) +
"x";


},80);

}


/* =====================================================
   CRASH
===================================================== */

function generateCrash(){

const r =
Math.random();


let crash =
1 /
Math.max(
0.05,
r
);


crash =
Math.min(
crash,
20
);


return Math.max(
1,
Number(
crash.toFixed(2)
)
);

}


/* =====================================================
   FINISH
===================================================== */

function finishGame(
bet,
target,
crash
){

const multiplier =
document.getElementById(
"multiplier"
);


const button =
document.getElementById(
"playButton"
);


let win = false;

let payout = 0;


multiplier.innerText =
crash.toFixed(2) +
"x";


if(crash >= target){

win = true;

payout =
bet * target;

balance += payout;

message(
"🏆 برنده شدی! +" +
payout.toLocaleString() +
" DOGS"
);

}else{

message(
"💥 ضریب روی " +
crash.toFixed(2) +
"x سقوط کرد."
);

}


showBalance();


saveHistory({

bet:bet,

target:target,

crash:crash,

win:win,

payout:payout,

time:
new Date()
.toLocaleTimeString()

});


playing = false;

button.disabled = false;

button.innerText =
"🎮 شروع LIMBO";


document.getElementById(
"status"
).innerText =
win
? "🏆 برد"
: "💥 باخت";


renderHistory();

}


/* =====================================================
   HISTORY
===================================================== */

const HISTORY_KEY =
"limbo_virtual_history";


function getHistory(){

try{

return JSON.parse(
localStorage.getItem(
HISTORY_KEY
)
) || [];

}catch{

return [];

}

}


function saveHistory(game){

const history =
getHistory();


history.unshift(game);


history.splice(20);


localStorage.setItem(
HISTORY_KEY,
JSON.stringify(history)
);

}


function renderHistory(){

const container =
document.getElementById(
"history"
);


const history =
getHistory();


if(!history.length){

container.innerHTML =
'<div style="color:#8993a5;font-size:12px">هنوز بازی‌ای انجام نشده.</div>';

return;

}


container.innerHTML =
history.map(function(game){

const cls =
game.win
? "win"
: "lose";


const result =
game.win
? "+" +
Number(
game.payout
).toLocaleString()
: "-" +
Number(
game.bet
).toLocaleString();


return `
<div class="historyItem">

<div>
${game.time}
<br>
🎯 ${Number(game.target).toFixed(2)}x
</div>

<div>
${Number(game.crash).toFixed(2)}x
</div>

<div class="${cls}">
${result} DOGS
</div>

</div>
`;

}).join("");

}


renderHistory();

updateWin();

</script>

</body>
    </html>
