<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>LIMBO DOGS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:#070a10;
color:#fff;
font-family:Arial,sans-serif;
}

.app{
max-width:520px;
margin:auto;
padding:16px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.logo{
font-size:24px;
font-weight:900;
}

.balance{
background:#151b27;
border:1px solid #293244;
border-radius:13px;
padding:10px;
}

.balance b{
direction:ltr;
}


.game{
height:300px;
border-radius:24px;
background:
radial-gradient(circle,#202a3b,#080b12);
border:1px solid #293244;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}


.icon{
font-size:65px;
}


.multiplier{
font-size:58px;
font-weight:900;
direction:ltr;
}


.status{
color:#9aa4b5;
}


.panel{
margin-top:15px;
background:#111620;
border:1px solid #293244;
border-radius:20px;
padding:15px;
}


label{
display:block;
color:#9ca7b8;
margin-bottom:7px;
}


input{
width:100%;
height:52px;
background:#080c13;
border:1px solid #303a4d;
border-radius:13px;
color:white;
padding:10px;
font-size:17px;
direction:ltr;
}


.quick{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-top:8px;
}


.quick button{
height:38px;
border:0;
border-radius:10px;
background:#1b2331;
color:white;
}


.play{
width:100%;
height:55px;
margin-top:10px;
border:0;
border-radius:15px;
font-size:18px;
font-weight:bold;
}


.message{
text-align:center;
margin-top:12px;
color:#aaa;
}


.history{
margin-top:15px;
}

.historyItem{
background:#111620;
border:1px solid #242d3d;
border-radius:12px;
padding:10px;
margin-bottom:7px;
display:flex;
justify-content:space-between;
font-size:12px;
}


.win{
color:#62e6a2;
}

.lose{
color:#ff6d78;
}

</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="logo">
🐶 LIMBO
</div>


<div class="balance">
موجودی:
<b id="balance">
0 DOGS
</b>
</div>


</div>


<div class="game">

<div class="icon">
🎯
</div>


<div id="multiplier"
class="multiplier">
1.00x
</div>


<div id="status"
class="status">
آماده
</div>


    </div>
    <div class="panel">


<label>
تعداد DOGS
</label>

<input id="bet"
type="number"
placeholder="مثلاً 500">


<div class="quick">

<button onclick="setBet(100)">
100
</button>

<button onclick="setBet(500)">
500
</button>

<button onclick="setBet(1000)">
1K
</button>

<button onclick="setBet(5000)">
5K
</button>

</div>


<br>


<label>
ضریب هدف
</label>

<input id="target"
type="number"
value="2"
step="0.01">


<div class="quick">

<button onclick="setTarget(1.5)">
1.5x
</button>

<button onclick="setTarget(2)">
2x
</button>

<button onclick="setTarget(3)">
3x
</button>

<button onclick="setTarget(5)">
5x
</button>

</div>



<button id="playButton"
class="play"
onclick="play()">

🎮 شروع LIMBO

</button>



<div class="message"
id="message">
</div>


</div>



<div class="history">

<h4>
📜 تاریخچه
</h4>

<div id="history">
</div>

</div>



</div>



<script>


const tg =
window.Telegram.WebApp;


tg.ready();
tg.expand();



let userId = null;


if(
tg.initDataUnsafe &&
tg.initDataUnsafe.user
){

userId =
tg.initDataUnsafe.user.id;

}



let balance = 0;



/*
دریافت موجودی واقعی از bot.py
*/


async function loadBalance(){


if(!userId){

return;

}


try{


let res =
await fetch(
"https://YOUR_SERVER_URL/api/balance/"
+userId
);


let data =
await res.json();


balance =
Number(data.balance)||0;


showBalance();


}catch(e){


console.log(e);


}


}



function showBalance(){


document.getElementById(
"balance"
).innerText =

balance.toLocaleString()
+
" DOGS";


}



loadBalance();




function setBet(v){

document.getElementById(
"bet"
).value=v;

updateWin();

}



function setTarget(v){

document.getElementById(
"target"
).value=v;

updateWin();

}



function updateWin(){


let b =
Number(
document.getElementById("bet").value
)||0;


let t =
Number(
document.getElementById("target").value
)||0;


}


function message(t){

document.getElementById(
"message"
).innerText=t;

}



let playing=false;



function generateCrash(){


let r=Math.random();


let c=
1/Math.max(.05,r);


return Math.min(
20,
Number(c.toFixed(2))
);


}

    /* =========================
   GAME
========================= */

let playing = false;


function play(){

    if(playing)
        return;


    let bet =
        Number(
            document.getElementById("bet").value
        );


    let target =
        Number(
            document.getElementById("target").value
        );


    if(!bet || bet <= 0){

        message("❌ مقدار DOGS را وارد کنید");
        return;

    }


    if(!target || target < 1.01){

        message("❌ ضریب معتبر نیست");
        return;

    }


    if(bet > balance){

        message("❌ موجودی کافی نیست");
        return;

    }


    playing = true;


    document.getElementById(
        "playButton"
    ).disabled = true;


    balance -= bet;

    saveBalance();

    showBalance();


    let current = 1.00;


    let crash =
        generateCrash();



    let timer =
        setInterval(function(){


            current +=
                Math.random() * 0.12 + 0.03;


            document.getElementById(
                "multiplier"
            ).innerText =
                current.toFixed(2)+"x";



            if(current >= crash){


                clearInterval(timer);


                finishGame(
                    bet,
                    target,
                    crash
                );


            }


        },80);



}



function generateCrash(){

    let r =
        Math.random();


    let crash =
        1 / Math.max(
            0.05,
            r
        );


    crash =
        Math.min(
            crash,
            20
        );


    return Number(
        crash.toFixed(2)
    );

}



function finishGame(
    bet,
    target,
    crash
){


    let win = false;

    let payout = 0;



    if(crash >= target){


        win = true;


        payout =
            bet * target;


        balance += payout;


        message(
            "🏆 بردی +"+
            payout.toLocaleString()+
            " DOGS"
        );


    }else{


        message(
            "💥 باخت -"+
            bet.toLocaleString()+
            " DOGS"
        );


    }



    saveBalance();

    showBalance();



    document.getElementById(
        "multiplier"
    ).innerText =
        crash.toFixed(2)+"x";



    document.getElementById(
        "status"
    ).innerText =
        win ? "🏆 برد" : "💥 باخت";



    document.getElementById(
        "playButton"
    ).disabled = false;



    playing = false;


    saveHistory({

        bet:bet,
        target:target,
        crash:crash,
        win:win,
        payout:payout,
        time:new Date()
        .toLocaleTimeString()

    });


    renderHistory();

    }

    /* =========================
   HISTORY
========================= */

function getHistory(){

    try{

        return JSON.parse(
            localStorage.getItem(HISTORY_KEY)
        ) || [];

    }catch(e){

        return [];

    }

}



function saveHistory(game){

    let history = getHistory();

    history.unshift(game);


    if(history.length > 20){

        history.splice(20);

    }


    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history)
    );

}




function renderHistory(){

    const box =
        document.getElementById("history");


    if(!box)
        return;


    const history =
        getHistory();



    if(history.length === 0){

        box.innerHTML =
        `
        <div style="color:#8993a5;font-size:12px">
        هنوز بازی‌ای انجام نشده.
        </div>
        `;

        return;

    }



    box.innerHTML =
    history.map(game => {


        let result =
            game.win
            ?
            "+" + Number(game.payout).toLocaleString()
            :
            "-" + Number(game.bet).toLocaleString();



        return `

        <div class="historyItem">

            <div>
                ${game.time}
                <br>
                🎯 ${Number(game.target).toFixed(2)}x
            </div>


            <div>
                ${Number(game.crash).toFixed(2)}x
            </div>


            <div class="${game.win ? "win" : "lose"}">
                ${result} DOGS
            </div>

        </div>

        `;


    }).join("");

}


renderHistory();
showBalance();
updateWin();

    </script>

</body>
</html>
