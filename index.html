<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOGS LIMBO 🚀</title>

<style>
body{
    background:#07111f;
    color:white;
    font-family:tahoma;
    text-align:center;
}

.box{
    margin:30px auto;
    max-width:420px;
}

h1{
    font-size:40px;
}

input,button{
    width:90%;
    padding:14px;
    margin:8px;
    border-radius:12px;
    border:0;
    font-size:18px;
}

button{
    background:#00bfff;
    color:white;
}

.game{
    height:250px;
    background:#02050b;
    border-radius:20px;
    position:relative;
    overflow:hidden;
}

#rocket{
    position:absolute;
    bottom:20px;
    right:20px;
    font-size:60px;
    transition:2s;
}

#result{
    margin-top:20px;
    font-size:22px;
}
</style>

</head>

<body>

<div class="box">

<h1>🚀 DOGS LIMBO</h1>

<h2>
💰 موجودی:
<span id="balance">0</span>
DOGS
</h2>


<div class="game">
<div id="rocket">🚀</div>
</div>


<input id="bet" type="number" placeholder="تعداد DOGS">

<input id="target" type="number" step="0.01" placeholder="ضریب مثال 2.5">


<button onclick="startGame()">
🚀 شروع
</button>


<div id="result"></div>


</div>


<script>

let userId = "1";


async function getBalance(){

try{

let res = await fetch("/balance/"+userId);

let data = await res.json();

document.getElementById("balance").innerHTML =
data.balance;


}catch(e){

document.getElementById("balance").innerHTML="خطا";

}

}



async function startGame(){


let bet =
Number(document.getElementById("bet").value);


let target =
Number(document.getElementById("target").value);



if(!bet || !target){

alert("مقدار و ضریب را وارد کن");

return;

}



let rocket =
document.getElementById("rocket");


rocket.style.right="250px";

rocket.style.bottom="180px";



try{


let res = await fetch("/limbo",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

id:userId,

bet:bet,

target:target

})

});



let data = await res.json();



if(data.win){

document.getElementById("result").innerHTML =
"✅ بردی +"+data.prize+" DOGS 🚀";

}else{

document.getElementById("result").innerHTML =
"💥 باختی";

}



}catch(e){

document.getElementById("result").innerHTML =
"❌ سرور وصل نیست";

}



setTimeout(()=>{

rocket.style.right="20px";
rocket.style.bottom="20px";

},2000);



getBalance();


}


getBalance();


</script>

</body>
</html>
