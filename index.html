<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOGS Rocket LIMBO</title>

<style>
body{
background:#071321;
color:white;
font-family:tahoma;
text-align:center;
margin:0;
}

.box{
max-width:430px;
margin:15px auto;
background:#102238;
padding:20px;
border-radius:20px;
}

h1{color:#00eaff}

input{
width:90%;
padding:12px;
margin:6px;
border-radius:10px;
border:0;
}

button{
padding:12px 20px;
border:0;
border-radius:12px;
background:#00bfff;
font-size:17px;
cursor:pointer;
margin:5px;
}

.balance{
font-size:22px;
color:#00ff99;
}

.space{
height:250px;
background:#020711;
border-radius:15px;
position:relative;
overflow:hidden;
}

#rocket{
position:absolute;
bottom:20px;
right:20px;
font-size:45px;
transition:.5s;
}

.multi{
font-size:38px;
color:#ffd700;
margin:15px;
}

.card{
background:#091726;
padding:15px;
border-radius:15px;
margin-top:15px;
}

.history{
max-height:150px;
overflow:auto;
text-align:right;
}

.wallet{
font-size:12px;
word-break:break-all;
color:#00d9ff;
}
</style>

</head>

<body>

<div class="box">

<h1>🚀 DOGS LIMBO</h1>

<div class="balance">
موجودی:
<span id="balance"></span> DOGS
</div>


<div class="card">

<h3>🎯 بازی</h3>

<input id="bet" type="number" placeholder="مقدار شرط DOGS" value="100">

<input id="target" type="number" step="0.01"
placeholder="ضریب هدف مثلا 2.5"
value="2.5">

<br>

<button onclick="start()">شروع 🚀</button>

</div>


<div class="space">
<div id="rocket">🚀</div>
</div>


<div class="multi">
x<span id="multi">1.00</span>
</div>


<div class="card">

<h3>💳 واریز DOGS</h3>

<div class="wallet">
UQAhqiO6qZc_aRpkIygNulDUw64jCSR_VXX7Vg2Cbbv1Uz1h
</div>

<button onclick="copyWallet()">کپی ولت</button>


<input id="charge"
type="number"
placeholder="مقدار شارژ">

<button onclick="charge()">ثبت شارژ</button>

</div>


<div class="card">

<h3>📜 تاریخچه</h3>

<div id="history" class="history"></div>

</div>

</div>



<script>

let balance =
Number(localStorage.getItem("dogs")) || 10000;


let history =
JSON.parse(localStorage.getItem("history")) || [];


let running=false;
let timer;
let multi=1;
let target=2.5;
let bet=0;



function save(){

localStorage.setItem("dogs",balance);

localStorage.setItem(
"history",
JSON.stringify(history)
);

}



function update(){

document.getElementById("balance")
.innerHTML=balance.toFixed(0);


document.getElementById("history")
.innerHTML=
history.reverse().map(x=>
"<div>"+x+"</div>"
).join("");

history.reverse();

}


update();



function start(){

if(running)return;


bet=Number(
document.getElementById("bet").value
);


target=Number(
document.getElementById("target").value
);



if(bet<=0 || bet>balance){

alert("مقدار شرط اشتباه است");
return;

}


if(target<1.1){

alert("ضریب باید بیشتر از 1.1 باشد");
return;

}



balance-=bet;
save();
update();


running=true;
multi=1;


document.getElementById("rocket")
.style.right="20px";



timer=setInterval(()=>{


multi+=0.05;


document.getElementById("multi")
.innerHTML=multi.toFixed(2);



document.getElementById("rocket")
.style.right=
(20+multi*25)+"px";



// رسیدن به ضریب انتخابی

if(multi>=target){


clearInterval(timer);
running=false;


let win=
bet*target;


balance+=win;


history.push(
"✅ برد x"+
target.toFixed(2)+
" +"+
win.toFixed(0)+
" DOGS"
);


save();
update();


alert(
"بردی 🚀 "+
win.toFixed(0)+" DOGS"
);


reset();


}


// احتمال انفجار

if(Math.random()<0.025){


clearInterval(timer);
running=false;


history.push(
"💥 باخت در x"+
multi.toFixed(2)
);


save();
update();


alert(
"موشک منفجر شد 💥"
);


reset();

}



},400);

}




function reset(){

multi=1;

document.getElementById("multi")
.innerHTML="1.00";

document.getElementById("rocket")
.style.right="20px";

}



function charge(){


let amount=
Number(
document.getElementById("charge").value
);


if(amount<=0)return;


balance+=amount;

history.push(
"💳 شارژ +"+
amount+
" DOGS"
);


save();
update();


alert("شارژ انجام شد");

}




function copyWallet(){

navigator.clipboard.writeText(
"UQAhqiO6qZc_aRpkIygNulDUw64jCSR_VXX7Vg2Cbbv1Uz1h"
);

alert("ولت کپی شد");

}


</script>


</body>
</html>
