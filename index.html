<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOGS Rocket LIMBO</title>

<style>

body{
background:#050b16;
color:white;
font-family:tahoma;
text-align:center;
margin:0;
}

.box{
max-width:430px;
margin:20px auto;
background:#102238;
padding:20px;
border-radius:20px;
}

h1{
color:#00eaff;
}

input{
width:90%;
padding:12px;
margin:7px;
border-radius:10px;
border:0;
font-size:18px;
}

button{
width:90%;
padding:13px;
margin:7px;
border:0;
border-radius:12px;
background:#00bfff;
font-size:18px;
}

.balance{
font-size:24px;
color:#00ff99;
margin:15px;
}

.game{
height:250px;
background:#02050b;
border-radius:15px;
position:relative;
overflow:hidden;
}

#rocket{
position:absolute;
right:20px;
bottom:20px;
font-size:50px;
transition:.3s;
}

.multi{
font-size:45px;
color:#ffd700;
margin:15px;
}

.card{
background:#091625;
padding:15px;
border-radius:15px;
margin-top:15px;
}

.wallet{
font-size:12px;
color:#00d9ff;
word-break:break-all;
}

.history{
max-height:150px;
overflow:auto;
text-align:right;
}

</style>
</head>

<body>

<div class="box">

<h1>🚀 DOGS LIMBO</h1>

<div class="balance">
موجودی:
<span id="balance">10000</span>
DOGS
</div>


<div class="card">

<h3>🎯 بازی</h3>

ضریب انتخابی:

<input id="target"
type="number"
value="2.5"
step="0.01">


تعداد DOGS شرط:

<input id="bet"
type="number"
value="100">


<button id="startBtn">
شروع 🚀
</button>


</div>


<div class="game">

<div id="rocket">
🚀
</div>

</div>


<div class="multi">
x<span id="multi">1.00</span>
</div>


<div class="card">

<h3>💳 واریز DOGS</h3>

<div class="wallet">
UQAhqiO6qZc_aRpkIygNulDUw64jCSR_VXX7Vg2Cbbv1Uz1h
</div>

<button id="copy">
کپی ولت
</button>


<input id="charge"
type="number"
placeholder="مقدار شارژ">


<button id="chargeBtn">
شارژ تستی
</button>


</div>


<div class="card">

<h3>📜 تاریخچه</h3>

<div id="history" class="history"></div>

</div>


</div>
<script>

let balance = Number(localStorage.getItem("dogs")) || 10000;

let history = JSON.parse(localStorage.getItem("history")) || [];

let playing = false;
let timer = null;
let multiplier = 1;


function saveData(){

localStorage.setItem(
"dogs",
balance
);

localStorage.setItem(
"history",
JSON.stringify(history)
);

}



function updateScreen(){

document.getElementById("balance").innerHTML =
balance.toFixed(0);


document.getElementById("history").innerHTML =
history.slice().reverse()
.map(item => "<p>"+item+"</p>")
.join("");

}


updateScreen();



document.getElementById("startBtn")
.onclick = function(){


if(playing){
return;
}



let bet =
Number(document.getElementById("bet").value);



let target =
Number(document.getElementById("target").value);



if(!Number.isFinite(bet) ||
!Number.isFinite(target)){

alert("عدد وارد کن");
return;

}



if(bet <= 0){

alert("شرط باید بیشتر از صفر باشد");
return;

}



if(bet > balance){

alert("موجودی کافی نیست");
return;

}



if(target < 1.10){

alert("ضریب کم است");
return;

}



balance -= bet;

saveData();

updateScreen();



playing = true;

document.getElementById("startBtn").disabled=true;


multiplier = 1;



document.getElementById("rocket")
.style.right="20px";



timer=setInterval(function(){


multiplier += 0.05;



document.getElementById("multi")
.innerHTML =
multiplier.toFixed(2);



document.getElementById("rocket")
.style.right =
(20 + multiplier*25)+"px";





// رسیدن به ضریب انتخابی

if(multiplier >= target){


clearInterval(timer);


let win =
bet * target;



balance += win;



history.push(
"🚀 برد | x"+
target.toFixed(2)+
" | +"+
win.toFixed(0)+
" DOGS"
);



finish(
"بردی "+win.toFixed(0)+" DOGS"
);


}





// انفجار

else if(Math.random() < 0.02){



clearInterval(timer);



history.push(
"💥 باخت | انفجار x"+
multiplier.toFixed(2)
);



finish(
"موشک منفجر شد 💥"
);



}



},400);



};




function finish(message){


playing=false;


document.getElementById("startBtn")
.disabled=false;


saveData();

updateScreen();


alert(message);



multiplier=1;


document.getElementById("multi")
.innerHTML="1.00";


document.getElementById("rocket")
.style.right="20px";


}



</script>

    <script>

document.getElementById("chargeBtn").onclick=function(){

let amount =
Number(document.getElementById("charge").value);


if(!Number.isFinite(amount) || amount<=0){

alert("مقدار شارژ اشتباه است");
return;

}



balance += amount;



history.push(
"💳 شارژ +"+
amount+
" DOGS"
);



saveData();

updateScreen();


alert(
"شارژ انجام شد"
);



};



document.getElementById("copy")
.onclick=function(){


let wallet =
"UQAhqiO6qZc_aRpkIygNulDUw64jCSR_VXX7Vg2Cbbv1Uz1h";


navigator.clipboard.writeText(wallet);


alert(
"ولت کپی شد"
);


};



</script>


</body>
</html>
