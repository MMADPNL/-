<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>DOGS Crash</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#080b12;
color:white;
font-family:Arial,sans-serif;
}

.container{
max-width:480px;
margin:auto;
padding:16px;
}

.card{
background:#121722;
border-radius:22px;
padding:20px;
margin-bottom:14px;
}

.balance{
text-align:center;
font-size:24px;
font-weight:bold;
}

.title{
text-align:center;
font-size:18px;
margin-bottom:10px;
}

.rocket{
height:130px;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
}

.multiplier{
text-align:center;
font-size:48px;
font-weight:bold;
}

.status{
text-align:center;
min-height:28px;
margin-top:10px;
color:#b8becb;
}

input{
width:100%;
border:0;
outline:0;
border-radius:14px;
padding:15px;
background:#202735;
color:white;
font-size:18px;
text-align:center;
}

button{
width:100%;
border:0;
border-radius:14px;
padding:15px;
margin-top:10px;
font-size:18px;
font-weight:bold;
background:#229ed9;
color:white;
}

button:disabled{
opacity:.4;
}

.cash{
background:#e84b4b;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="title">
🐶 موجودی داگز
</div>

<div
id="balance"
class="balance"
>
در حال دریافت...
</div>

</div>


<div class="card">

<div
id="rocket"
class="rocket"
>
🚀
</div>

<div
id="multiplier"
class="multiplier"
>
1.00x
</div>

<div
id="status"
class="status"
>
مبلغ شرط را وارد کن
</div>

</div>


<div class="card">

<input
id="bet"
type="number"
min="1"
value="100"
placeholder="مبلغ داگز"
/>

<button
id="start"
>
🚀 شروع بازی
</button>

<button
id="cashout"
class="cash"
disabled
>
💰 برداشت
</button>

</div>

</div>


<script>

const tg =
window.Telegram.WebApp;

tg.ready();
tg.expand();


const headers = {
"Content-Type":
"application/json",

"X-Telegram-Init-Data":
tg.initData
};


let balance = 0;

let gameId = null;

let crash = 0;

let multiplier = 1;

let bet = 0;

let playing = false;

let timer = null;


function setBalance(value){

balance = Number(value);

document.getElementById(
"balance"
).textContent =
balance.toLocaleString(
"en-US"
) + " DOGS";

}


function setStatus(text){

document.getElementById(
"status"
).textContent = text;

}


async function api(
url,
data = {}
){

const response =
await fetch(
url,
{
method:"POST",
headers:headers,
body:JSON.stringify(data)
}
);

const result =
await response.json();

if(!response.ok){

throw new Error(
result.error ||
"خطا"
);

}

return result;

}


async function loadBalance(){

try{

const result =
await api(
"/api/balance"
);

setBalance(
result.dogs
);

}
catch(error){

setStatus(
error.message
);

}

}


function resetButtons(){

playing = false;

document.getElementById(
"start"
).disabled = false;

document.getElementById(
"cashout"
).disabled = true;

}


document.getElementById(
"start"
).onclick =
async function(){

if(playing){
return;
}

bet =
Math.floor(
Number(
document.getElementById(
"bet"
).value
)
);

if(!bet || bet < 1){

setStatus(
"مبلغ شرط نامعتبر است"
);

return;

}


try{

const result =
await api(
"/api/start-game",
{
bet:bet
}
);

gameId =
result.game_id;

crash =
Number(
result.crash
);

setBalance(
result.dogs
);

multiplier = 1;

playing = true;

document.getElementById(
"start"
).disabled = true;

document.getElementById(
"cashout"
).disabled = false;

setStatus(
"🚀 موشک پرواز کرد!"
);


clearInterval(timer);

timer =
setInterval(
function(){

multiplier =
Number(
(
multiplier +
0.01 +
multiplier * 0.012
).toFixed(2)
);

document.getElementById(
"multiplier"
).textContent =
multiplier.toFixed(2) +
"x";


if(multiplier >= crash){

clearInterval(timer);

setStatus(
"💥 موشک ترکید! باختی."
);

resetButtons();

loadBalance();

}

},
100
);

}
catch(error){

setStatus(
error.message
);

}

};


document.getElementById(
"cashout"
).onclick =
async function(){

if(!playing){
return;
}

const currentMultiplier =
multiplier;


try{

const result =
await api(
"/api/cashout",
{
game_id:gameId,
multiplier:currentMultiplier
}
);

clearInterval(timer);

if(result.lost){

setStatus(
"💥 دیر برداشت کردی؛ باختی."
);

setBalance(
result.dogs
);

resetButtons();

return;

}


setBalance(
result.dogs
);

setStatus(
"🎉 بردی! +" +
Number(
result.payout
).toLocaleString(
"en-US"
) +
" DOGS"
);

resetButtons();

}
catch(error){

setStatus(
error.message
);

}

};


loadBalance();

</script>

</body>

  </html>
