<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DOGS Rocket 🚀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #0a0a2a 0%, #1a1a4e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #gameContainer {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }
        #balanceBox {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 10px 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        #balanceBox span {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
        #rocketCanvas {
            background: radial-gradient(ellipse at bottom, #1a1a4e 0%, #0a0a2a 100%);
            border-radius: 20px;
            width: 100%;
            height: 400px;
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }
        .input-group input {
            padding: 12px 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
            width: 100%;
            max-width: 120px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .input-group input:focus {
            outline: none;
            border-color: #ffd700;
        }
        .input-group label {
            font-size: 14px;
            color: #aaa;
        }
        #betBtn {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
            margin-top: 10px;
        }
        #betBtn:active {
            transform: scale(0.95);
        }
        #betBtn:disabled {
            opacity: 0.5;
            transform: scale(1);
            cursor: not-allowed;
        }
        #multiplierDisplay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            pointer-events: none;
        }
        #resultMsg {
            font-size: 18px;
            margin-top: 10px;
            min-height: 30px;
        }
        .win { color: #00ff88; }
        .loss { color: #ff4444; }
        .info-text {
            font-size: 12px;
            color: https://mmadpnl.github.io/-/
            margin-top: 10px;
        }
        #targetInput {
            max-width: 80px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="balanceBox">
            🐶 موجودی: <span id="balanceDisplay">0</span> DOGS
        </div>
        <div id="rocketCanvas">
            <canvas id="gameCanvas"></canvas>
            <div id="multiplierDisplay">1.00x</div>
        </div>
        <div id="controls">
            <div class="input-group">
                <label>💰 شرط:</label>
                <input type="number" id="betInput" value="10" min="1" step="1">
                <label>🎯 هدف:</label>
                <input type="number" id="targetInput" value="2.00" min="1.10" max="10.00" step="0.10">
                <label>x</label>
            </div>
            <button id="betBtn">🚀 پرواز</button>
            <div id="resultMsg"></div>
            <div class="info-text">ضریب هدف رو انتخاب کن و شرط ببند!</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ------ تنظیمات ------
        const API_URL = "https://your-server.com"; // 👈 اینجا آدرس سرور خودت رو بذار (مثلا https://dogs-rocket.onrender.com)
        let user_id = tg.initDataUnsafe?.user?.id || 123456789;
        let balance = 0;
        let gameRunning = false;
        let betAmount = 10;
        let targetMultiplier = 2.00;
        let currentMultiplier = 1.00;
        let animationFrame = null;
        let canvas, ctx;

        // ------ DOM ------
        const balanceDisplay = document.getElementById('balanceDisplay');
        const betInput = document.getElementById('betInput');
        const targetInput = document.getElementById('targetInput');
        const betBtn = document.getElementById('betBtn');
        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const resultMsg = document.getElementById('resultMsg');

        // ------ Canvas ------
        function initCanvas() {
            canvas = document.getElementById('gameCanvas');
            const container = document.getElementById('rocketCanvas');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx = canvas.getContext('2d');
            drawRocket(1.00);
        }

        function drawRocket(multiplier) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width, h = canvas.height;
            const rocketX = w/2;
            const baseY = h - 50;
            const progress = Math.min((multiplier - 1) / 9, 1);
            const rocketY = baseY - progress * (h - 100);

            // ستاره‌ها
            ctx.fillStyle = 'white';
            for (let i=0; i<50; i++) {
                let x = (i*137 + 50) % w;
                let y = (i*251 + 30) % h;
                ctx.beginPath();
                ctx.arc(x, y, (i%3)+1, 0, Math.PI*2);
                ctx.fill();
            }

            // موشک
            const size = 30 + progress * 10;
            ctx.fillStyle = '#ff6b35';
            ctx.shadowColor = '#ff6b35';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.moveTo(rocketX, rocketY - size);
            ctx.lineTo(rocketX - size/2, rocketY + size/2);
            ctx.lineTo(rocketX, rocketY + size/3);
            ctx.lineTo(rocketX + size/2, rocketY + size/2);
            ctx.closePath();
            ctx.fill();
            // شعل
            ctx.fillStyle = '#f7931e';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.moveTo(rocketX - size/4, rocketY + size/3);
            ctx.lineTo(rocketX, rocketY + size/1.2);
            ctx.lineTo(rocketX + size/4, rocketY + size/3);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            // نمایش ضریب روی موشک
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(multiplier.toFixed(2)+'x', rocketX, rocketY - size - 10);
        }

        // ------ API calls ------
        async function fetchBalance() {
            try {
                const res = await fetch(`${API_URL}/api/balance?user_id=${user_id}`);
                const data = await res.json();
                if (data.balance !== undefined) {
                    balance = data.balance;
                    balanceDisplay.textContent = balance;
                }
            } catch(e) {
                console.error('Error fetching balance:', e);
            }
        }

        async function startGame(bet, target) {
            if (gameRunning) return;
            if (bet > balance) {
                resultMsg.textContent = '❌ موجودی کافی نیست!';
                resultMsg.className = 'loss';
                return;
            }
            gameRunning = true;
            betBtn.disabled = true;
            resultMsg.textContent = '🚀 در حال پرواز...';
            resultMsg.className = '';

            try {
                const res = await fetch(`${API_URL}/api/start-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id, bet, target })
                });
                const data = await res.json();
                if (data.error) {
                    resultMsg.textContent = '❌ ' + data.error;
                    resultMsg.className = 'loss';
                    gameRunning = false;
                    betBtn.disabled = false;
                    return;
                }

                // شبیه‌سازی انیمیشن تا نقطه crash
                let multiplier = 1.00;
                const step = 0.02;
                const interval = 50;
                const crashPoint = data.crash_point;
                const win = data.win;
                const winAmount = data.win_amount || 0;

                const animate = () => {
                    if (multiplier >= crashPoint || multiplier >= 10) {
                        // پایان بازی
                        if (win) {
                            resultMsg.textContent = `🎉 برد! ${winAmount} DOGS`;
                            resultMsg.className = 'win';
                        } else {
                            resultMsg.textContent = `💥 باخت! ضریب: ${crashPoint.toFixed(2)}x`;
                            resultMsg.className = 'loss';
                        }
                        balance = data.new_balance;
                        balanceDisplay.textContent = balance;
                        gameRunning = false;
                        betBtn.disabled = false;
                        drawRocket(multiplier);
                        multiplierDisplay.textContent = multiplier.toFixed(2) + 'x';
                        return;
                    }
                    multiplier += step;
                    currentMultiplier = multiplier;
                    multiplierDisplay.textContent = multiplier.toFixed(2) + 'x';
                    drawRocket(multiplier);
                    setTimeout(animate, interval);
                };
                animate();

            } catch(e) {
                resultMsg.textContent = '❌ خطا در ارتباط با سرور';
                resultMsg.className = 'loss';
                gameRunning = false;
                betBtn.disabled = false;
            }
        }

        // ------ Event Listeners ------
        betInput.addEventListener('change', () => {
            betAmount = parseInt(betInput.value) || 10;
            if (betAmount < 1) betAmount = 1;
            betInput.value = betAmount;
        });

        targetInput.addEventListener('change', () => {
            targetMultiplier = parseFloat(targetInput.value) || 2.00;
            if (targetMultiplier < 1.10) targetMultiplier = 1.10;
            if (targetMultiplier > 10) targetMultiplier = 10;
            targetInput.value = targetMultiplier.toFixed(2);
        });

        betBtn.addEventListener('click', () => {
            const bet = parseInt(betInput.value) || 10;
            const target = parseFloat(targetInput.value) || 2.00;
            startGame(bet, target);
        });

        // ------ Init ------
        window.addEventListener('resize', initCanvas);
        initCanvas();
        fetchBalance();
        setInterval(fetchBalance, 10000);
    </script>
</body>
                                               </html>
