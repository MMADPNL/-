<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIMBO Rocket</title>

<style>
body{
    margin:0;
    background:#07111f;
    color:white;
    font-family:tahoma;
    text-align:center;
}

.box{
    max-width:420px;
    margin:20px auto;
    background:#101d33;
    padding:20px;
    border-radius:20px;
}

h1{
    color:#00d9ff;
}

.balance{
    font-size:22px;
    margin:15px;
}

.space{
    height:220px;
    background:#020711;
    border-radius:15px;
    overflow:hidden;
    position:relative;
}

#rocket{
    position:absolute;
    bottom:20px;
    right:20px;
    font-size:45px;
    transition:1s;
}

.mult{
    font-size:35px;
    color:#00ff99;
    margin:15px;
}

button{
    background:#00bfff;
    border:0;
    padding:12px 25px;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
}

input{
    padding:10px;
    border-radius:10px;
    width:120px;
}

.history{
    text-align:right;
    background:#091526;
    padding:10px;
    border-radius:10px;
    margin-top:15px;
    max-height:150px;
    overflow:auto;
}
</style>

</head>

<body>

<div class="box">

<h1>🚀 LIMBO ROCKET</h1>

<div class="balance">
موجودی DOGS:
<span id="balance"></span>
</div>

<input id="bet" type="number" value="100">

<br><br>

<div class="space">
<div id="rocket">🚀</div>
</div>

<div class="mult">
x<span id="multi">1.00</span>
</div>

<button onclick="startGame()">شروع LIMBO</button>
<button onclick="cashout()">برداشت</button>


<div class="history">
<h3>تاریخچه</h3>
<div id="history"></div>
</div>

</div>


<script>

let balance =
localStorage.getItem("dogs") || 10000;

let history =
JSON.parse(localStorage.getItem("history")) || [];

let game=false;
let multiplier=1;
let timer;


function update(){

document.getElementById("balance").innerHTML=
Number(balance).toFixed(0);

document.getElementById("history").innerHTML=
history.slice().reverse().map(x=>"<div>"+x+"</div>").join("");

}

update();



function startGame(){

if(game)return;

let bet=
Number(document.getElementById("bet").value);

if(bet>balance || bet<=0){
alert("موجودی کافی نیست");
return;
}

balance-=bet;
localStorage.setItem("dogs",balance);

game=true;
multiplier=1;

document.getElementById("rocket").style.right="20px";


timer=setInterval(()=>{

multiplier+=0.05;

document.getElementById("multi").innerHTML=
multiplier.toFixed(2);


let move=20+(multiplier*20);

document.getElementById("rocket").style.right=
move+"px";


if(Math.random()<0.03){

clearInterval(timer);
game=false;

history.push(
"🚀 انفجار در x"+multiplier.toFixed(2)
);

localStorage.setItem("history",
JSON.stringify(history));

update();

alert("موشک منفجر شد 💥");

}

},500);

}



function cashout(){

if(!game)return;

let bet=
Number(document.getElementById("bet").value);

clearInterval(timer);
game=false;

let win=
bet*multiplier;

balance+=win;

history.push(
"✅ برد x"+multiplier.toFixed(2)+
" +"+win.toFixed(0)+" DOGS"
);

localStorage.setItem("dogs",balance);
localStorage.setItem("history",
JSON.stringify(history));


update();

document.getElementById("multi").innerHTML="1.00";

alert("بردی 🚀");

}

</script>

</body>
</html>
