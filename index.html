<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOGS Rocket LIMBO</title>

<style>

body{
background:#050b16;
color:white;
font-family:tahoma;
text-align:center;
margin:0;
}

.box{
max-width:430px;
margin:20px auto;
background:#102238;
padding:20px;
border-radius:20px;
}

h1{
color:#00eaff;
}

input{
width:90%;
padding:12px;
margin:7px;
border-radius:10px;
border:0;
font-size:18px;
}

button{
width:90%;
padding:13px;
margin:7px;
border:0;
border-radius:12px;
background:#00bfff;
font-size:18px;
cursor:pointer;
}

button:disabled{
opacity:.5;
}

.balance{
font-size:24px;
color:#00ff99;
margin:15px;
}

.game{
height:250px;
background:#02050b;
border-radius:15px;
position:relative;
overflow:hidden;
}

#rocket{
position:absolute;
right:20px;
bottom:20px;
font-size:50px;
transition:.3s;
}

.multi{
font-size:45px;
color:#ffd700;
margin:15px;
}

.card{
background:#091625;
padding:15px;
border-radius:15px;
margin-top:15px;
}

.history{
max-height:150px;
overflow:auto;
text-align:right;
}

.deposit{
display:none;
background:#020b18;
padding:15px;
border-radius:15px;
margin-top:10px;
}

.deposit.show{
display:block;
}

.deposit-title{
color:#00ff99;
font-size:20px;
font-weight:bold;
margin-bottom:12px;
}

.deposit-info{
background:#102238;
padding:12px;
border-radius:10px;
margin:8px 0;
word-break:break-all;
}

.wallet{
font-size:13px;
color:#00d9ff;
}

.close{
background:#455a64;
}

.copy{
background:#00a86b;
}

</style>
</head>

<body>

<div class="box">

<h1>🚀 DOGS LIMBO</h1>

<div class="balance">
موجودی:
<span id="balance">10000</span>
DOGS
</div>


<!-- بازی -->

<div class="card">

<h3>🎯 بازی</h3>

<label>ضریب انتخابی</label>

<input
id="target"
type="number"
value="2.5"
min="1.10"
step="0.01"
placeholder="مثلاً 2.50"
>


<label>تعداد DOGS شرط</label>

<input
id="bet"
type="number"
value="100"
min="1"
step="1"
placeholder="مثلاً 100"
>


<button id="startBtn">
شروع 🚀
</button>

</div>


<div class="game">

<div id="rocket">
🚀
</div>

</div>


<div class="multi">
x<span id="multi">1.00</span>
</div>


<!-- واریز -->

<div class="card">

<button id="depositBtn">
💳 واریز DOGS
</button>


<div id="depositBox" class="deposit">

<div class="deposit-title">
💳 اطلاعات واریز DOGS
</div>


<div class="deposit-info">

ULTRA 5000 DOGS @IQ7XA

</div>


<div class="deposit-info wallet">

UQAhqiO6qZc_aRpkIygNulDUw64jCSR_VXX7Vg2Cbbv1Uz1h

</div>


<button id="copyBtn" class="copy">
📋 کپی ولت
</button>


<button id="closeDeposit" class="close">
بستن
</button>

</div>

</div>


<!-- تاریخچه -->

<div class="card">

<h3>📜 تاریخچه</h3>

<div id="history" class="history"></div>

</div>


</div>


<script>

let balance =
Number(localStorage.getItem("dogs")) || 10000;

let history =
JSON.parse(localStorage.getItem("history")) || [];

let playing = false;

let timer = null;

let multiplier = 1;


function saveData(){

localStorage.setItem(
"dogs",
balance
);

localStorage.setItem(
"history",
JSON.stringify(history)
);

}


function updateScreen(){

document.getElementById("balance").innerHTML =
balance.toFixed(0);

document.getElementById("history").innerHTML =
history
.slice()
.reverse()
.map(item => "<p>"+item+"</p>")
.join("");

}


updateScreen();


// ======================
// شروع بازی
// ======================

document.getElementById("startBtn")
.onclick = function(){

if(playing){
return;
}


let bet =
Number(
document.getElementById("bet").value
);


let target =
Number(
document.getElementById("target").value
);


if(
!Number.isFinite(bet) ||
!Number.isFinite(target)
){

alert("عدد وارد کن");

return;

}


if(bet <= 0){

alert("تعداد DOGS باید بیشتر از صفر باشد");

return;

}


if(bet > balance){

alert("موجودی DOGS کافی نیست");

return;

}


if(target < 1.10){

alert("ضریب باید حداقل 1.10 باشد");

return;

}


balance -= bet;

saveData();

updateScreen();


playing = true;

document.getElementById("startBtn")
.disabled = true;


multiplier = 1;


document.getElementById("rocket")
.style.right = "20px";


timer = setInterval(function(){

multiplier += 0.05;


document.getElementById("multi")
.innerHTML =
multiplier.toFixed(2);


document.getElementById("rocket")
.style.right =
(20 + multiplier * 25) + "px";


// ======================
// برد
// ======================

if(multiplier >= target){

clearInterval(timer);


let win =
bet * target;


balance += win;


history.push(
"🚀 برد | x" +
target.toFixed(2) +
" | شرط " +
bet.toFixed(0) +
" | +"+
win.toFixed(0) +
" DOGS"
);


finish(
"بردی " +
win.toFixed(0) +
" DOGS 🎉"
);

}


// ======================
// انفجار
// ======================

else if(Math.random() < 0.02){

clearInterval(timer);


history.push(
"💥 باخت | انفجار x" +
multiplier.toFixed(2) +
" | -" +
bet.toFixed(0) +
" DOGS"
);


finish(
"موشک منفجر شد 💥"
);

}


},400);

};


// ======================
// پایان بازی
// ======================

function finish(message){

playing = false;


document.getElementById("startBtn")
.disabled = false;


saveData();

updateScreen();


alert(message);


multiplier = 1;


document.getElementById("multi")
.innerHTML = "1.00";


document.getElementById("rocket")
.style.right = "20px";

}


// ======================
// نمایش اطلاعات واریز
// ======================

document.getElementById("depositBtn")
.onclick = function(){

document.getElementById("depositBox")
.classList.add("show");

};


// ======================
// بستن اطلاعات واریز
// ======================

document.getElementById("closeDeposit")
.onclick = function(){

document.getElementById("depositBox")
.classList.remove("show");

};


// ======================
// کپی ولت
// ======================

document.getElementById("copyBtn")
.onclick = async function(){

let wallet =
"UQAhqiO6qZc_aRpkIygNulDUw64jCSR_VXX7Vg2Cbbv1Uz1h";


try{

await navigator.clipboard.writeText(wallet);

alert("ولت کپی شد ✅");

}
catch(e){

alert("کپی خودکار انجام نشد؛ ولت را دستی کپی کن.");

}

};

</script>

</body>
</html>
