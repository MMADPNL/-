<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>DOGS LIMBO</title>
</head>
<body style="background:#07111f;color:white;text-align:center;font-family:tahoma">

<h1>🚀 DOGS LIMBO</h1>

<h3>موجودی: <span id="bal">...</span> DOGS</h3>

<input id="bet" placeholder="تعداد DOGS">
<br><br>
<input id="target" placeholder="ضریب مثال 2.5">
<br><br>

<button onclick="play()">شروع 🚀</button>

<p id="msg"></p>

<script>
let id="1";

async function load(){
 let r=await fetch("/balance/"+id);
 let d=await r.json();
 document.getElementById("bal").innerHTML=d.balance;
}
load();

async function play(){
 let bet=document.getElementById("bet").value;
 let target=document.getElementById("target").value;

 let r=await fetch("/limbo",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({id,bet,target})
 });

 let d=await r.json();
 document.getElementById("msg").innerHTML=
 d.win ? "✅ بردی +" + d.amount :
 "💥 باختی";

 load();
}
</script>

</body>
</html>
