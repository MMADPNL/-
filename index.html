<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DOGS LIMBO 🚀</title>

<style>

body{
background:#050b16;
color:white;
font-family:tahoma;
text-align:center;
}

.box{
max-width:450px;
margin:auto;
padding:20px;
}

.game{
height:350px;
background:#02050b;
border-radius:20px;
position:relative;
overflow:hidden;
}

#rocket{

position:absolute;
bottom:20px;
right:20px;
font-size:70px;

}


#multi{

font-size:45px;
color:#00ff99;
margin:20px;

}


input{

width:90%;
padding:15px;
margin:10px;
font-size:20px;
border-radius:10px;
border:0;

}


button{

width:90%;
padding:15px;
font-size:22px;
background:#008cff;
color:white;
border:0;
border-radius:12px;

}


</style>

</head>


<body>


<div class="box">


<h1>🚀 DOGS LIMBO</h1>


<h2>
💰 موجودی:
<span id="balance">
10000
</span>
DOGS
</h2>



<div class="game">

<div id="rocket">
🚀
</div>

</div>



<div id="multi">
x1.00
</div>



<input id="bet"
placeholder="تعداد DOGS مثلا 100">


<input id="target"
placeholder="ضریب مثلا 2.5">



<button onclick="startGame()">
🚀 شروع
</button>


<h2 id="result"></h2>


</div>





<script>


let playing=false;



function faToEn(str){

return String(str).replace(/[۰-۹]/g,function(d){

return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);

});

}




function startGame(){



if(playing){

return;

}



let betInput =
document.getElementById("bet").value;


let targetInput =
document.getElementById("target").value;



let bet =
Number(faToEn(betInput));


let target =
Number(faToEn(targetInput));



if(
isNaN(bet)
||
isNaN(target)
||
bet<=0
||
target<=1
){

alert("مقدار و ضریب درست وارد کن");

return;

}



playing=true;



let rocket =
document.getElementById("rocket");


let multi =
document.getElementById("multi");


let result =
document.getElementById("result");



let x=1;



let crash =
Number((Math.random()*5+1).toFixed(2));



let timer=setInterval(function(){



x+=0.05;



multi.innerHTML=
"x"+x.toFixed(2);



rocket.style.bottom =
(20+x*25)+"px";




if(x>=target){


clearInterval(timer);


result.innerHTML=
"✅ بردی +"+Math.floor(bet*target)+" DOGS";


end();


}



if(x>=crash){


clearInterval(timer);


result.innerHTML=
"💥 انفجار x"+crash;


end();


}



},100);



}





function end(){


playing=false;


setTimeout(function(){


document.getElementById("rocket").style.bottom="20px";


document.getElementById("multi").innerHTML="x1.00";


},2000);


}


</script>


</body>

</html>
