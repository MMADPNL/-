<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOGS LIMBO</title>

<style>

body{
background:#07111f;
color:white;
font-family:tahoma;
text-align:center;
}

.box{
max-width:450px;
margin:auto;
padding:20px;
}

h1{
font-size:40px;
}

#balance{
color:#00ff99;
}


.game{

height:350px;
background:#02050b;
border-radius:20px;
position:relative;
overflow:hidden;

}


#rocket{

position:absolute;
bottom:40px;
right:40px;
font-size:65px;
transition:0.2s;

}


#multi{

position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);

font-size:35px;
color:#00ff99;

}



input,button{

width:90%;
padding:14px;
margin:8px;
border-radius:12px;
border:0;
font-size:18px;

}


button{

background:#0099ff;
color:white;

}


#result{

font-size:25px;
margin-top:20px;

}


</style>

</head>


<body>


<div class="box">


<h1>🚀 DOGS LIMBO</h1>


<h2>
💰 موجودی:
<span id="balance">0</span>
DOGS
</h2>



<div class="game">

<div id="rocket">
🚀
</div>


<div id="multi">
x1.00
</div>


</div>



<input id="bet"
type="number"
placeholder="تعداد DOGS">



<input id="target"
type="number"
step="0.01"
placeholder="ضریب مثال 2.5">



<button onclick="startGame()">
🚀 شروع
</button>



<div id="result"></div>



</div>



<script>


let userId="1";



async function loadBalance(){

try{


let res=await fetch("/balance/"+userId);

let data=await res.json();


document.getElementById("balance").innerHTML=
data.balance;



}catch(e){

document.getElementById("balance").innerHTML=
"خطا";

}

}



async function startGame(){


let bet=
Number(document.getElementById("bet").value);


let target=
Number(document.getElementById("target").value);



if(!bet || !target){

alert("تعداد و ضریب را وارد کن");

return;

}



let rocket=
document.getElementById("rocket");


let multi=
document.getElementById("multi");


let result=
document.getElementById("result");



let x=1;


let move=setInterval(()=>{


x+=0.05;


multi.innerHTML=
"x"+x.toFixed(2);



rocket.style.bottom=
(40+x*15)+"px";



},100);





let res=await fetch("/limbo",{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

id:userId,

bet:bet,

target:target

})


});



let data=await res.json();



clearInterval(move);



if(data.win){


result.innerHTML=
"✅ بردی +"+data.prize+" DOGS 🚀";


multi.innerHTML=
"🚀 x"+target;


}

else{


result.innerHTML=
"💥 باختی";


multi.innerHTML=
"💣 انفجار";


}



rocket.style.bottom="40px";


loadBalance();



}




loadBalance();


</script>


</body>

</html>
