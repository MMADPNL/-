<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>DOGS LIMBO 🚀</title>

<style>

body{
background:#050b16;
color:white;
font-family:tahoma;
text-align:center;
}

.box{
width:400px;
margin:auto;
padding:20px;
}

.game{
height:300px;
background:#02050b;
border-radius:20px;
position:relative;
overflow:hidden;
}

#rocket{
position:absolute;
bottom:20px;
right:20px;
font-size:60px;
transition:.2s;
}

#multi{
font-size:40px;
color:#00ff99;
margin:15px;
}

input,button{

width:90%;
padding:15px;
margin:8px;
border-radius:12px;
border:0;
font-size:18px;

}

button{
background:#00aaff;
color:white;
}

</style>

</head>

<body>

<div class="box">

<h1>🚀 DOGS LIMBO</h1>


<h2>
💰 موجودی:
<span id="balance">
10000
</span>
DOGS
</h2>


<div class="game">

<div id="rocket">
🚀
</div>

</div>


<div id="multi">
x1.00
</div>


<input id="bet" placeholder="تعداد DOGS">


<input id="target" placeholder="ضریب مثال 2.5">


<button onclick="start()">
شروع 🚀
</button>


<h2 id="result"></h2>


</div>



<script>


let playing=false;


function start(){


if(playing)return;


let bet =
Number(document.getElementById("bet").value);


let target =
Number(document.getElementById("target").value);



if(!bet || !target){

alert("مقدار و ضریب را وارد کن");

return;

}


playing=true;


let crash =
(Number(Math.random()*8)+1).toFixed(2);



let x=1;


let rocket =
document.getElementById("rocket");


let multi =
document.getElementById("multi");



let timer=setInterval(()=>{


x+=0.05;


multi.innerHTML=
"x"+x.toFixed(2);


rocket.style.bottom=
(20+x*20)+"px";



if(x>=target){


clearInterval(timer);


document.getElementById("result").innerHTML=
"✅ بردی +"+(bet*target).toFixed(0)+" DOGS";


finish();


}



if(x>=crash){


clearInterval(timer);


document.getElementById("result").innerHTML=
"💥 انفجار x"+crash;


finish();

}



},100);



}



function finish(){


playing=false;


setTimeout(()=>{

document.getElementById("rocket").style.bottom="20px";

document.getElementById("multi").innerHTML="x1.00";

},2000);


}


</script>

</body>
</html>
